<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Окрашивание строки</title>
  <style>
    table {
      border-collapse: collapse;
      margin: 20px;
    }
    td {
      border: 1px solid #333;
      padding: 15px 30px;
      cursor: pointer;
      text-align: center;
    }
    td:hover {
      background-color: #f0f0f0;
    }

    .selected {
      background-color: red;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr>
      <td>4</td>
      <td>5</td>
      <td>6</td>
    </tr>
    <tr>
      <td>7</td>
      <td>8</td>
      <td>9</td>
    </tr>
  </table>

  <script src="task2.js"></script>

</body>
</html>
