<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    td {
      border: 1px solid #333;
      padding: 20px 30px;
      cursor: pointer;
      text-align: center;
    }
    td:hover {
      background-color: #f0f0f0;
    }
    button {
      padding: 10px 30px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #333;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <table id="tableColor">
    <tr>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr>
      <td>4</td>
      <td>5</td>
      <td>6</td>
    </tr>
    <tr>
      <td>7</td>
      <td>8</td>
      <td>9</td>
    </tr>
  </table>

  <button id="button">Нажми на ячейку</button>
    
    <script src="task1.js"></script>
</body>
</html>
